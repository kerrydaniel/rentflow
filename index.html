<!doctype html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="RentFlow property and rent management software"/>
  <title>RentFlow — Property Management</title>
  <style>
    html,body,#root{margin:0;min-height:100%;width:100%}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
    .boot{min-height:100vh;display:grid;place-items:center}
    .boot-card{width:min(440px,calc(100% - 40px));padding:32px;background:#fff;border:1px solid #e3e8f0;border-radius:18px;box-shadow:0 20px 60px rgba(16,24,39,.08);text-align:center}
    .boot-card h1{margin:0 0 10px}.boot-card p{color:#667189;line-height:1.5}.boot-error{margin-top:18px;padding:12px;text-align:left;background:#fff6e5;border-radius:9px;color:#7a4b00;word-break:break-word}
  </style>
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-card">
        <h1>RentFlow</h1>
        <p id="boot-message">Starting the application…</p>
        <div id="boot-error" class="boot-error" hidden></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener("error",function(e){
      var box=document.getElementById("boot-error");
      var msg=document.getElementById("boot-message");
      if(box){box.hidden=false;box.textContent="Startup error: "+(e.error&&e.error.message||e.message||"Unknown JavaScript error");}
      if(msg){msg.textContent="RentFlow could not start. Please reload the page.";}
    });
    window.addEventListener("unhandledrejection",function(e){
      var box=document.getElementById("boot-error");
      var msg=document.getElementById("boot-message");
      if(box){box.hidden=false;box.textContent="Startup error: "+(e.reason&&e.reason.message||String(e.reason)||"Unknown promise error");}
      if(msg){msg.textContent="RentFlow could not start. Please reload the page.";}
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
